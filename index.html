<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFFDF7;font-family:system-ui,-apple-system,sans-serif;color:#1F1F24}
form{background:#fff;border:2px solid #E6E1D6;border-radius:24px;padding:32px 28px;width:min(360px,90vw);display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
h1{margin:0;font-size:34px;line-height:1}
h1 .a{color:#2563C9}h1 .b{color:#C2560C}h1 .c{color:#1E7A45}h1 .d{color:#6D3FC4}h1 .e{color:#B8326E}
label{font-weight:700;font-size:15px}
input[type=password]{font-size:18px;padding:12px 14px;border:2px solid #C9C3B6;border-radius:12px;width:100%;box-sizing:border-box}
.row{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.row input{width:22px;height:22px}
button{font-size:18px;font-weight:700;min-height:48px;border:0;border-radius:999px;background:#1F1F24;color:#fff;cursor:pointer}
#err{color:#B42318;font-weight:700;min-height:20px;margin:0}
</style>

<body>
<form id="f" hidden>
  <h1>School App <span class="a">demo</span></h1>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <label class="row"><input id="keep" type="checkbox" checked> Stay signed in on this device</label>
  <button type="submit">Open</button>
  <p id="err" role="alert"></p>
</form>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function decryptWith(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.i)},key,ub(P.c));
  return new TextDecoder().decode(pt);
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return await crypto.subtle.deriveBits({name:"PBKDF2",salt:ub(P.s),iterations:P.n,hash:"SHA-256"},base,256);
}
function show(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  document.title=doc.title;
  document.head.innerHTML=doc.head.innerHTML;
  document.body.innerHTML=doc.body.innerHTML;
  document.body.querySelectorAll("script").forEach(old=>{const s=document.createElement("script");s.textContent=old.textContent;old.replaceWith(s);});
}
/* Auto-update: whenever the app is opened or brought back, check for a newer version */
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"});
    const t=await r.text(); const m=t.match(/"i": "([^"]+)"/);
    if(m&&m[1]!==P.i){location.replace(location.pathname+"?v="+encodeURIComponent(m[1].slice(0,8))+location.hash)}
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
window.addEventListener("pageshow",checkUpdate);
setInterval(checkUpdate,30*60*1000);
(async()=>{
  let saved=null; try{saved=localStorage.getItem("pyf-key")}catch(e){}
  if(saved){try{show(await decryptWith(ub(saved)));return}catch(e){try{localStorage.removeItem("pyf-key")}catch(_){}}}
  const f=document.getElementById("f"); f.hidden=false; document.getElementById("pw").focus();
  f.onsubmit=async ev=>{
    ev.preventDefault(); const err=document.getElementById("err"); err.textContent="Checking...";
    try{
      const raw=await derive(document.getElementById("pw").value);
      const html=await decryptWith(raw);
      if(document.getElementById("keep").checked){try{localStorage.setItem("pyf-key",bu(raw))}catch(e){}}
      show(html);
    }catch(e){err.textContent="That password isn't right. Try again.";}
  };
})();
})();
</script>
